[project]
name = "gallery-sr"
version = "0.1.0"
description = "Upscales the pages a reader sends, on this machine's GPU"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "pillow>=11",
]

[project.scripts]
gallery-sr = "gallery_sr.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gallery_sr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
