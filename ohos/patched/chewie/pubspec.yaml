name: chewie
description: >-
  chewie 1.13.1 with a default branch in the switch over TargetPlatform of
  AdaptiveControls, which the HarmonyOS Flutter SDK's extra
  TargetPlatform.ohos needs. Used only by HarmonyOS builds
  (ohos/pubspec_overrides.ohos.yaml).
version: 1.13.1+ohos.1
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  video_player: ^2.10.0
  wakelock_plus: ^1.3.2

flutter:
  uses-material-design: true
