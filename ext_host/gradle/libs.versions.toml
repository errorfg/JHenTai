# Versions of the libraries Tachiyomi extensions link against. The Android app
# compiles the same host sources with these versions (see android.gradle).
[versions]
kotlin = "2.2.20"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.4.0"
jsoup = "1.21.2"
rxjava = "1.3.8"
preference = "1.2.1"
dex2jar = "2.4.38"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
dex2jar-translator = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
